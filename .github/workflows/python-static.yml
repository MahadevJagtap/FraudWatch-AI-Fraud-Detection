name: Python static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse all Python sources
        shell: python
        run: |
          import ast
          from pathlib import Path

          files = [
              path for path in Path(".").rglob("*.py")
              if not {".git", ".venv", "venv"}.intersection(path.parts)
          ]
          if not files:
              raise SystemExit("No Python source files found")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          print(f"Parsed {len(files)} Python files successfully")
