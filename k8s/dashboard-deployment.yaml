apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudwatch-dashboard
  namespace: fraudwatch
  labels:
    app: fraudwatch-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraudwatch-dashboard
  template:
    metadata:
      labels:
        app: fraudwatch-dashboard
    spec:
      containers:
        - name: dashboard
          image: fraudwatch-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: fraudwatch-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraudwatch-dashboard-service
  namespace: fraudwatch
spec:
  type: NodePort
  selector:
    app: fraudwatch-dashboard
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30501
