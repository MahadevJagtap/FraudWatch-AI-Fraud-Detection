apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudwatch-api
  namespace: fraudwatch
  labels:
    app: fraudwatch-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraudwatch-api
  template:
    metadata:
      labels:
        app: fraudwatch-api
    spec:
      containers:
        - name: api
          image: fraudwatch-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fraudwatch-config
            - secretRef:
                name: fraudwatch-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fraudwatch-api-service
  namespace: fraudwatch
spec:
  type: NodePort
  selector:
    app: fraudwatch-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
