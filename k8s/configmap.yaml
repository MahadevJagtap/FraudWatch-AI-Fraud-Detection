apiVersion: v1
kind: ConfigMap
metadata:
  name: fraudwatch-config
  namespace: fraudwatch
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_BASE_URL: "http://fraudwatch-api-service:8000"
  KAFKA_BOOTSTRAP_SERVERS: "fraudwatch-kafka-service:9092"
  KAFKA_TRANSACTIONS_TOPIC: "fraudwatch.transactions.raw"
  KAFKA_ALERTS_TOPIC: "fraudwatch.alerts.fraud"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_HEADLESS: "true"
